<script>
/* Awards absolute bottom-left "Who" panel: Swiper 11 + SwiperGL, random
   shaders, 1200ms. Two reusable GL textures animate stills/video snapshots;
   the original media element renders at rest for sharp, transparent playback. */
(() => {
  'use strict';
  const panel=document.getElementById('media-panel'), live=document.getElementById('live-media');
  const container=document.getElementById('gl-transition'), wrapper=container.querySelector('.swiper-wrapper');
  let playlist=[], pending=null, signature='', index=-1, current=null, running=false;
  let timer, watchdog, token=0, request=null, swiper=null, enginePromise=null;
  const failed=new Set();
  // Match the live element's actual box, including non-16:9 browser windows.
  // Fixed 1920x1080 snapshots were being cover-cropped by GL at the handoff.
  function frameCanvas() {
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,container.clientWidth);
    canvas.height=Math.max(1,container.clientHeight);
    return canvas;
  }
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function snapshot(media) {
    const canvas=frameCanvas();
    const WIDTH=canvas.width, HEIGHT=canvas.height;
    const w=media.videoWidth||media.naturalWidth, h=media.videoHeight||media.naturalHeight;
    if(!w||!h)throw Error('No decoded dimensions');
    const scale=Math.min(WIDTH/w,HEIGHT/h);

  }
  async function prepare(item) {

        else resolve();

      if(item.kind==='video')media.onloadeddata=()=>done();

  }
  async function engine() {
    if(enginePromise)return enginePromise;
    enginePromise=(async()=>{

      for(let n=0;n<2;n++){
        const slide=document.createElement('div');slide.className='swiper-slide';
        const image=document.createElement('img');image.className='swiper-gl-image';image.src=blank.toDataURL();
        slide.append(image);wrapper.append(slide);

        modules:[SwiperGL],effect:'gl',gl:{shader:'random'},
        creativeEffect:{limitProgress:5,prev:{shadow:true},next:{shadow:true}},
        speed:1200,watchSlidesProgress:true,allowTouchMove:false,simulateTouch:false,

      // changing the original shader's color/deformation calculations.
      const original=gl.createMaterial;

        const source=this.shader.fragment;

      // the shader while its canvas was on screen.

  function shufflePlaylist() {
    // Fisher-Yates: every item appears once in each pass.
    for(let i=playlist.length-1;i>0;i--){

      [playlist[i],playlist[j]]=[playlist[j],playlist[i]];
    }
    // Avoid showing the last item of a pass again immediately, when possible.
    const previous=current?.getAttribute('src');

      const alternatives=[];

        if(playlist[i].src!==previous && !failed.has(playlist[i].src))alternatives.push(i);
      }
      if(alternatives.length){
        const j=alternatives[Math.floor(Math.random()*alternatives.length)];

  }

    if(running)return;

      release(current);current=null;live.replaceChildren();running=false;return;
    }
    for(let attempt=0;attempt<playlist.length;attempt++){
      if(index<0 || index+1>=playlist.length){
        shufflePlaylist();
        index=0;
      }else{index++;}

      const item=playlist[index];if(failed.has(item.src))continue;

          running=false;schedule();return;
        }
        const media=await prepare(item);

  };

    if(request)return;
    const xhr=new XMLHttpRequest();request=xhr;
    const finish=()=>{if(request===xhr)request=null;};
    xhr.open('GET','./media-playlist.json?v='+Date.now(),true);xhr.timeout=20000;
    xhr.onload=()=>{
      try{
        if(xhr.status!==0&&(xhr.status<200||xhr.status>=300))throw Error('Playlist could not be read');
        const data=JSON.parse(xhr.responseText.replace(/^\uFEFF/,''));

          !item||typeof item.src!=='string'||!item.src.trim()||!['image','video'].includes(item.kind))) {
          throw Error('Invalid media playlist');
        }

      }catch(error){console.warn('Media playlist refresh; keeping current list:',error.message);}
      finally{finish();}
    };
    xhr.onerror=xhr.ontimeout=finish;xhr.send();
  }
  refresh();setInterval(refresh,5*60000);
})();

</script>

(() => {

  const clock=document.getElementById('mini-clock');
  const refreshing=document.getElementById('content-refresh-display');
  const countdown=document.getElementById('content-refresh-timer');
  let refreshExpires=0,checkingRefresh=false;
  function checkRefreshStatus(){
    if(checkingRefresh)return;checkingRefresh=true;
    const xhr=new XMLHttpRequest();
    xhr.open('GET','./refresh-status.json?v='+Date.now(),true);xhr.timeout=5000;
    const done=()=>{checkingRefresh=false;};
    xhr.onload=()=>{
      try{
        if(xhr.status!==0&&(xhr.status<200||xhr.status>=300))return;
        const data=JSON.parse(xhr.responseText.replace(/^\uFEFF/,''));
        const expires=Date.parse(data.ExpiresUtc);
        if(Number.isFinite(expires)){refreshExpires=expires;updateClock();}
      }catch(error){/* Missing or temporarily unreadable status keeps the clock working. */}
      finally{done();}
    };
    xhr.onerror=xhr.ontimeout=done;xhr.send();
  }
  const timeFormat = new Intl.DateTimeFormat('en-US', {
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  const dayFormat = new Intl.DateTimeFormat('en-US', {weekday:'long'});
  const dateFormat = new Intl.DateTimeFormat('en-US', {
    month:'long', day:'numeric', year:'numeric'
  });
  function updateClock() {
    const now = new Date();
    const remaining=Math.max(0,Math.ceil((refreshExpires-now.getTime())/1000));
    const active=remaining>0;
    clock.hidden=active;refreshing.hidden=!active;
    if(active){
      countdown.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
    }
    time.textContent = timeFormat.format(now);
    time.dateTime = now.toISOString();
    day.textContent = dayFormat.format(now);
    date.textContent = dateFormat.format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);
  checkRefreshStatus();
  setInterval(checkRefreshStatus,2000);
  document.addEventListener('visibilitychange', updateClock);
})();
</script>
<script>
(() => {
  'use strict';
  const CSV_FILE = './JBER-Events.csv';

  const counter = document.getElementById('jber-events-page');
  let events = [], loaded = false, signature = '', scrollAnimation = null;
  // Handles quoted commas, escaped quotes, CRLF and multiline CSV fields.
  function parseCSV(text) {
    text = text.replace(/^\uFEFF/, '');
    const rows = []; let row = [], field = '', quoted = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (c === '"') {
        if (quoted && text[i + 1] === '"') { field += '"'; i++; }
        else quoted = !quoted;
      } else if (c === ',' && !quoted) { row.push(field); field = ''; }
      else if ((c === '\n' || c === '\r') && !quoted) {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); if (row.some(v => v.trim())) rows.push(row);
        row = []; field = '';
      } else field += c;
    }
    if (quoted) throw new Error('Incomplete CSV');
    row.push(field); if (row.some(v => v.trim())) rows.push(row);
    if (!rows.length) throw new Error('Missing CSV header');
    const header = rows.shift();
    for (const name of ['Start','End','AllDay','Event','Location']) {
      if (!header.includes(name)) throw new Error('Missing column ' + name);
    }
    return rows.map(values => Object.fromEntries(header.map((key,i) => [key,values[i] || ''])));
  }
  function alaskaToday() {
    const parts = new Intl.DateTimeFormat('en-US',{timeZone:'America/Anchorage',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
    const p = Object.fromEntries(parts.map(v => [v.type,v.value]));
    return p.year + '-' + p.month + '-' + p.day;
  }
  function activeEvents() {
    const today = alaskaToday();
    const limit = new Date(today + 'T12:00:00Z'); limit.setUTCDate(limit.getUTCDate() + 28);
    const last = limit.toISOString().slice(0,10);
    return events.filter(e => e.End.slice(0,10) >= today && e.Start.slice(0,10) < last);
  }

    const el = document.createElement(tag); el.className = cls; el.textContent = text; return el;
  }
  function dateLabel(value) {
    return new Intl.DateTimeFormat('en-US',{weekday:'short',month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(value.slice(0,10) + 'T12:00:00Z'));
  }
  function render() {
    if (!loaded) return;
    const active = activeEvents();
    const freshSignature = JSON.stringify(active);
    if (freshSignature === signature) return;
    signature = freshSignature;
    if (scrollAnimation) scrollAnimation.cancel();
    list.replaceChildren();

      const time = /^true$/i.test(e.AllDay) ? 'All day' : e.Start.slice(11,16) + (e.End !== e.Start ? '–' + e.End.slice(11,16) : '');
      when.append(element('div','jber-event-time',time));
      if (overnight) {
        const endDate = new Intl.DateTimeFormat('en-US',{month:'short',day:'numeric',timeZone:'UTC'}).format(new Date(e.End.slice(0,10) + 'T12:00:00Z'));
        when.append(element('div','jber-event-time','Ends ' + endDate));

  }

    xhr.onload = () => {
      try {
        if (xhr.status !== 0 && (xhr.status < 200 || xhr.status >= 300)) throw new Error('CSV unavailable');

        if (fresh.some(e => !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(e.Start) || !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(e.End))) throw new Error('Invalid event date');
        loaded = true;

  }

  setInterval(render,60000);
  new ResizeObserver(() => { signature = ''; render(); }).observe(list);
  setInterval(reloadEvents,REFRESH_MINUTES * 60000);
})();
</script>

  function node(tag,cls,text) {
    const e = document.createElement(tag); e.className = cls; e.textContent = text; return e;
  }
  function stop() { if (animation) { animation.cancel(); animation = null; } }
  function currentMonth() {
    const now = new Date();
    return {key:now.getFullYear() + '-' + now.getMonth(), file:String.fromCharCode(65 + now.getMonth()) + '.txt',label:new Intl.DateTimeFormat('en-US',{month:'long'}).format(now)};
  }
  function selectMonth() {
    const month = currentMonth();

      monthKey = month.key; generation++; names = []; signature = ''; stop();
      viewport.replaceChildren(); monthLabel.textContent = month.label;
      status.hidden = false; status.textContent = 'Loading names…';
    }

  }

    const next = monthKey + JSON.stringify(names);

  const INTERVAL = 5 * 60 * 1000;
  const entries = [...document.querySelectorAll('img[class^="img-L"]')].map(el => ({
    el, source:el.getAttribute('src'), signature:null, pixelSignature:null, objectURL:null, busy:false
  }));
  async function pixelFingerprint(image) {
    // Native resolution, no resizing or tolerance: preserve even one-pixel text edits.
    const canvas=document.createElement('canvas');
    canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
    try {
      const context=canvas.getContext('2d',{willReadFrequently:true});
      context.drawImage(image,0,0);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
      const digest=await crypto.subtle.digest('SHA-256',pixels);
      return canvas.width+'x'+canvas.height+':'+[...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
    } finally {
      canvas.width=canvas.height=0;
    }
  }
  async function check(entry) {
    if (entry.busy) return;
    entry.busy = true;
    let newURL = null;
    try {
      const bytes = await new Promise((resolve,reject) => {
        const xhr = new XMLHttpRequest();
        const url = new URL(entry.source,document.baseURI);
        url.searchParams.set('leadershipRefresh',Date.now());
        xhr.open('GET',url.href,true);xhr.responseType='arraybuffer';xhr.timeout=30000;
        xhr.onload=()=>{
          if ((xhr.status===0 || (xhr.status>=200 && xhr.status<300)) && xhr.response?.byteLength) resolve(xhr.response);
          else reject(new Error('Image unavailable'));
        };
        xhr.onerror=xhr.ontimeout=()=>reject(new Error('Image read failed'));
        xhr.send();
      });
      const digest = await crypto.subtle.digest('SHA-256',bytes);
      const signature = [...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
      if (signature===entry.signature) return;
      newURL=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
      const replacement=new Image();
      for (const attr of entry.el.attributes) {
        if (attr.name!=='src') replacement.setAttribute(attr.name,attr.value);
      }
      await new Promise((resolve,reject)=>{
        const timeout=setTimeout(()=>reject(new Error('Image decode timed out')),30000);
        replacement.onload=()=>{clearTimeout(timeout);resolve();};
        replacement.onerror=()=>{clearTimeout(timeout);reject(new Error('Image is incomplete or damaged'));};
        replacement.src=newURL;
      });
      if(replacement.decode) await replacement.decode();
      const pixelSignature=await pixelFingerprint(replacement);
      if(pixelSignature===entry.pixelSignature){
        // Remember the new encoding without disturbing the displayed image or snow.
        entry.signature=signature;
        return;
      }
      const oldURL=entry.objectURL;
      entry.el.replaceWith(replacement);
      entry.el=replacement;entry.signature=signature;entry.pixelSignature=pixelSignature;entry.objectURL=newURL;newURL=null;
      // Notify the existing snow handler so accumulation follows the new image outline.
      replacement.dispatchEvent(new Event('load'));
      if(oldURL) requestAnimationFrame(()=>requestAnimationFrame(()=>URL.revokeObjectURL(oldURL)));
    } catch(error) {
      console.warn('Keeping existing leadership image:',entry.source,error.message);
    } finally {
      if(newURL) URL.revokeObjectURL(newURL);
      entry.busy=false;
    }
  }
  // Check sequentially to limit memory and decoding load alongside the 4K slideshow.
  let checking=false;
  async function checkAll(){
    if(checking)return;checking=true;
    try{for(const entry of entries)await check(entry);}finally{checking=false;}
  }
  checkAll();
  setInterval(checkAll,INTERVAL);
})();
</script>
