<script>
/* Awards absolute bottom-left "Who" panel: Swiper 11 + SwiperGL, random
   shaders, 1200ms. Two reusable GL textures animate stills/video snapshots;
   the original media element renders at rest for sharp, transparent playback. */
(() => {
  'use strict';
  const panel=document.getElementById('media-panel'), live=document.getElementById('live-media');
  const container=document.getElementById('gl-transition'), wrapper=container.querySelector('.swiper-wrapper');
  let playlist=[], pending=null, signature='', index=-1, current=null, running=false;
  let timer, watchdog, token=0, request=null, swiper=null, enginePromise=null;
  const failed=new Set();
  // Match the live element's actual box, including non-16:9 browser windows.
  // Fixed 1920x1080 snapshots were being cover-cropped by GL at the handoff.
  function frameCanvas() {
    const canvas=document.createElement('canvas');
    canvas.width=Math.max(1,container.clientWidth);
    canvas.height=Math.max(1,container.clientHeight);
    return canvas;
  }
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  function snapshot(media) {
    const canvas=frameCanvas();
    const WIDTH=canvas.width, HEIGHT=canvas.height;
    const w=media.videoWidth||media.naturalWidth, h=media.videoHeight||media.naturalHeight;
    if(!w||!h)throw Error('No decoded dimensions');
    const scale=Math.min(WIDTH/w,HEIGHT/h);
    canvas.getContext('2d').drawImage(media,(WIDTH-w*scale)/2,(HEIGHT-h*scale)/2,w*scale,h*scale);
    return canvas;
  }
  async function prepare(item) {
    const media=document.createElement(item.kind==='video'?'video':'img');
    if(item.kind==='video'){
      media.muted=true;media.defaultMuted=true;media.playsInline=true;
      media.setAttribute('muted','');media.setAttribute('playsinline','');media.preload='auto';
    }else{media.alt='';media.draggable=false;media.decoding='async';}
    await new Promise((resolve,reject)=>{
      const timeout=setTimeout(()=>done(Error('load timeout')),30000);
      const done=error=>{
        clearTimeout(timeout);media.onload=media.onloadeddata=media.onerror=null;
        if(error){media.removeAttribute('src'); if(item.kind==='video')media.load();reject(error);}
        else resolve();
      };
      media.onerror=()=>done(Error('unsupported or damaged media'));
      if(item.kind==='video')media.onloadeddata=()=>done();
      else media.onload=()=>done();
      media.src=item.src;
    });
    if(item.kind==='image' && media.decode)await media.decode();
    return media;
  }
  async function engine() {
    if(enginePromise)return enginePromise;
    enginePromise=(async()=>{
      const blank=frameCanvas();
      for(let n=0;n<2;n++){
        const slide=document.createElement('div');slide.className='swiper-slide';
        const image=document.createElement('img');image.className='swiper-gl-image';image.src=blank.toDataURL();
        slide.append(image);wrapper.append(slide);
      }
      swiper=new Swiper(container,{
        modules:[SwiperGL],effect:'gl',gl:{shader:'random'},
        creativeEffect:{limitProgress:5,prev:{shadow:true},next:{shadow:true}},
        speed:1200,watchSlidesProgress:true,allowTouchMove:false,simulateTouch:false,
        autoplay:false,loop:false,resizeObserver:true,updateOnWindowResize:true
      });
      const deadline=Date.now()+10000;
      while(!swiper.gl?.initialized||!swiper.gl?.material){
        if(Date.now()>deadline)throw Error('WebGL initialization unavailable');
        await sleep(25);
      }
      const gl=swiper.gl;
      gl.renderer.dpr=1; gl.resize();
      const render=gl.renderer.render.bind(gl.renderer);
      gl.drawPreparedFrame=()=>render({scene:gl.scene,camera:gl.camera});
      gl.renderer.render=(options)=>{if(container.style.visibility==='visible')render(options);};
      // Some original artistic shaders force opacity. Mask empty margins without
      // changing the original shader's color/deformation calculations.
      const original=gl.createMaterial;
      gl.createMaterial=function(){
        const source=this.shader.fragment;
        this.shader.fragment=source.replace(/void\s+main\s*\(\s*\)/,'void originalMain()')+
          '\nvoid main(){ originalMain(); float maskAlpha=max(texture2D(texture1,vUv).a,texture2D(texture2,vUv).a); gl_FragColor.a=min(gl_FragColor.a,maskAlpha); }';
        try{return original.call(this);}finally{this.shader.fragment=source;}
      };
      gl.replaceShader('random');
      return gl;
    })();
    return enginePromise;
  }
  async function transition(from,to) {
    try{
      const gl=await engine();
      // Select and compile the next effect while the normal media is still visible.
      // Reusing slideTo in both directions caused GL to reverse progress and replace
      // the shader while its canvas was on screen.
      gl.replaceRandomShader();
      gl.textures[0].image=snapshot(from);gl.textures[0].needsUpdate=true;
      gl.textures[1].image=snapshot(to);gl.textures[1].needsUpdate=true;
      gl.material.uniforms.texture1.value=gl.textures[0];
      gl.material.uniforms.texture2.value=gl.textures[1];
      if(gl.shader.vertex){
        gl.vertexMaterial.uniforms.texture1.value=gl.textures[1];
        gl.vertexMaterial.uniforms.texture2.value=gl.textures[1];
      }
      gl.material.uniforms.progress.value=0;
      for(const name of Object.keys(gl.uniforms)){
        gl.material.uniforms[name].value=gl.uniforms[name].value;
      }
      gl.resize();
      await new Promise((resolve,reject)=>{
        requestAnimationFrame(()=>{
          try{
          // Upload textures and draw the outgoing frame BEFORE revealing the canvas.
          // These operations share one paint boundary with the visibility change.
          gl.drawPreparedFrame();
          container.style.visibility='visible';
          live.style.visibility='hidden';
          let finished=false;
          const finish=()=>{
            if(finished)return;
            finished=true;clearTimeout(fallback);
            cancelAnimationFrame(gl.animateUniformFrame);
            // Install the decoded incoming media and reveal it in the same callback.
            // No old/blank frame is exposed between WebGL and normal playback.
            live.replaceChildren(to);
            container.style.visibility='hidden';
            live.style.visibility='visible';
            resolve();
          };
          // Recovery only; normal completion comes from the animation itself.
          const fallback=setTimeout(finish,10000);
          gl.animateUniform(gl.material.uniforms.progress,1,finish);
          }catch(error){reject(error);}
        });
      });
    }catch(error){
      console.warn('GL transition unavailable; showing next media:',error.message);
      live.replaceChildren(to);
      container.style.visibility='hidden';live.style.visibility='visible';
    }
  }
  function release(media){
    if(!media)return;
    media.onended=media.onerror=media.ontimeupdate=null;
    if(media.tagName==='VIDEO'){media.pause();media.removeAttribute('src');media.load();}
    media.remove();
  }
  function schedule(){
    clearTimeout(timer);clearTimeout(watchdog);
    const mine=++token, media=current;
    if(!media)return;
    const go=()=>{if(mine===token)next();};
    if(media.tagName==='IMG'){timer=setTimeout(go,2000);return;}
    media.currentTime=0;media.muted=true;
    const fail=reason=>{
      if(mine!==token)return;
      console.warn('Skipping video:',playlist[index]?.src,reason);
      failed.add(playlist[index]?.src);go();
    };
    let position=-1;
    const arm=()=>{clearTimeout(watchdog);watchdog=setTimeout(()=>fail('no progress for 30 seconds'),30000);};
    media.onended=go;media.onerror=()=>fail('video playback error');
    media.ontimeupdate=()=>{if(mine===token&&media.currentTime>position){position=media.currentTime;arm();}};
    arm();media.play().catch(e=>fail(e.message));
  }
  function shufflePlaylist() {
    // Fisher-Yates: every item appears once in each pass.
    for(let i=playlist.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [playlist[i],playlist[j]]=[playlist[j],playlist[i]];
    }
    // Avoid showing the last item of a pass again immediately, when possible.
    const previous=current?.getAttribute('src');
    if(playlist.length>1 && playlist[0].src===previous){
      const alternatives=[];
      for(let i=1;i<playlist.length;i++){
        if(playlist[i].src!==previous && !failed.has(playlist[i].src))alternatives.push(i);
      }
      if(alternatives.length){
        const j=alternatives[Math.floor(Math.random()*alternatives.length)];
        [playlist[0],playlist[j]]=[playlist[j],playlist[0]];
      }
    }
  }
  async function next() {
    if(running)return;
    running=true;++token;clearTimeout(timer);clearTimeout(watchdog);
    if(current?.tagName==='VIDEO')current.pause();
    if(pending!==null){playlist=pending;pending=null;index=-1;failed.clear();}
    if(!playlist.length){
      release(current);current=null;live.replaceChildren();running=false;return;
    }
    for(let attempt=0;attempt<playlist.length;attempt++){
      if(index<0 || index+1>=playlist.length){
        shufflePlaylist();
        index=0;
      }else{index++;}

      const item=playlist[index];if(failed.has(item.src))continue;
      try{
        if(playlist.length===1&&current?.getAttribute('src')===item.src){
          running=false;schedule();return;
        }
        const media=await prepare(item);
        if(current)await transition(current,media);
        release(current);current=media;live.replaceChildren(media);
        running=false;schedule();return;
      }catch(error){failed.add(item.src);console.warn('Skipping media:',item.src,error.message);}
    }
    release(current);current=null;live.replaceChildren();running=false;
    timer=setTimeout(()=>{failed.clear();next();},30000);
  }
  window.receiveMediaPlaylist=data=>{
    if(!data||!Array.isArray(data.items))return;
    const items=data.items.filter(x=>x&&typeof x.src==='string'&&['image','video'].includes(x.kind));
    const sig=JSON.stringify(items);if(sig===signature)return;
    signature=sig;pending=items;
    if(!current&&!running)next();
  };
  function refresh(){
    if(request)return;
    const xhr=new XMLHttpRequest();request=xhr;
    const finish=()=>{if(request===xhr)request=null;};
    xhr.open('GET','./media-playlist.json?v='+Date.now(),true);xhr.timeout=20000;
    xhr.onload=()=>{
      try{
        if(xhr.status!==0&&(xhr.status<200||xhr.status>=300))throw Error('Playlist could not be read');
        const data=JSON.parse(xhr.responseText.replace(/^\uFEFF/,''));
        if(!data||!Array.isArray(data.items)||data.items.some(item=>
          !item||typeof item.src!=='string'||!item.src.trim()||!['image','video'].includes(item.kind))) {
          throw Error('Invalid media playlist');
        }
        window.receiveMediaPlaylist(data);
      }catch(error){console.warn('Media playlist refresh; keeping current list:',error.message);}
      finally{finish();}
    };
    xhr.onerror=xhr.ontimeout=finish;xhr.send();
  }
  refresh();setInterval(refresh,5*60000);
})();

</script>

<script>
(() => {
  const time = document.getElementById('mini-clock-time');
  const day = document.getElementById('mini-clock-day');
  const date = document.getElementById('mini-clock-date');
  const clock=document.getElementById('mini-clock');
  const refreshing=document.getElementById('content-refresh-display');
  const countdown=document.getElementById('content-refresh-timer');
  let refreshExpires=0,checkingRefresh=false;
  function checkRefreshStatus(){
    if(checkingRefresh)return;checkingRefresh=true;
    const xhr=new XMLHttpRequest();
    xhr.open('GET','./refresh-status.json?v='+Date.now(),true);xhr.timeout=5000;
    const done=()=>{checkingRefresh=false;};
    xhr.onload=()=>{
      try{
        if(xhr.status!==0&&(xhr.status<200||xhr.status>=300))return;
        const data=JSON.parse(xhr.responseText.replace(/^\uFEFF/,''));
        const expires=Date.parse(data.ExpiresUtc);
        if(Number.isFinite(expires)){refreshExpires=expires;updateClock();}
      }catch(error){/* Missing or temporarily unreadable status keeps the clock working. */}
      finally{done();}
    };
    xhr.onerror=xhr.ontimeout=done;xhr.send();
  }
  const timeFormat = new Intl.DateTimeFormat('en-US', {
    hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'
  });
  const dayFormat = new Intl.DateTimeFormat('en-US', {weekday:'long'});
  const dateFormat = new Intl.DateTimeFormat('en-US', {
    month:'long', day:'numeric', year:'numeric'
  });
  function updateClock() {
    const now = new Date();
    const remaining=Math.max(0,Math.ceil((refreshExpires-now.getTime())/1000));
    const active=remaining>0;
    clock.hidden=active;refreshing.hidden=!active;
    if(active){
      countdown.textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');
    }
    time.textContent = timeFormat.format(now);
    time.dateTime = now.toISOString();
    day.textContent = dayFormat.format(now);
    date.textContent = dateFormat.format(now);
  }
  updateClock();
  setInterval(updateClock, 1000);
  checkRefreshStatus();
  setInterval(checkRefreshStatus,2000);
  document.addEventListener('visibilitychange', updateClock);
})();
</script>

        if (quoted && text[i + 1] === '"') { field += '"'; i++; }
        else quoted = !quoted;
      } else if (c === ',' && !quoted) { row.push(field); field = ''; }
      else if ((c === '\n' || c === '\r') && !quoted) {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(field); if (row.some(v => v.trim())) rows.push(row);
        row = []; field = '';
      } else field += c;
    }
    if (quoted) throw new Error('Incomplete CSV');
    row.push(field); if (row.some(v => v.trim())) rows.push(row);
    if (!rows.length) throw new Error('Missing CSV header');
    const header = rows.shift();
    for (const name of ['Start','End','AllDay','Event','Location']) {

      status.hidden = false; status.textContent = 'Loading names…';
    }
    return month;
  }
  function render() {
    const next = monthKey + JSON.stringify(names);
    if (signature === next) return;
    signature = next; stop(); viewport.replaceChildren();
    status.hidden = names.length > 0;
    status.textContent = 'No names listed this month.';
    if (!names.length) return;
    const track = node('div','',''); track.id = 'monthly-names-track';
    const group = node('div','monthly-names-group','');
    for (const name of names) {
      const item = node('div','monthly-name','');
      item.append(node('span','monthly-name-text',name)); group.append(item);
    }
    track.append(group); viewport.append(track);
    requestAnimationFrame(() => {
      if (!track.isConnected) return;
      const distance = group.getBoundingClientRect().height;
      if (distance <= viewport.clientHeight) return;
      const copy = group.cloneNode(true); copy.setAttribute('aria-hidden','true'); track.append(copy);
      animation = track.animate([{transform:'translateY(0)'},{transform:'translateY(-' + distance + 'px)'}],{

    });
  }
  function reload() {
    const month = selectMonth();
    const requestGeneration = ++generation;
    const xhr = new XMLHttpRequest();
    xhr.open('GET','./' + month.file + '?v=' + Date.now(),true); xhr.timeout = 20000;
    function failed() {
      if (requestGeneration !== generation) return;
      if (!names.length) {
        status.hidden = false; status.textContent = 'No names available this month.';
      }
    }
    xhr.onload = () => {
      if (requestGeneration !== generation) return;
      // Reject a response from the old month even if midnight fell during its download.
      if (currentMonth().key !== month.key) { reload(); return; }
      if (xhr.status !== 0 && (xhr.status < 200 || xhr.status >= 300)) { failed(); return; }
      if (/^\s*<!doctype html|^\s*<html/i.test(xhr.responseText)) { failed(); return; }
      names = xhr.responseText.replace(/^\uFEFF/,'').split(/\r\n|\n|\r/).map(v => v.trim()).filter(Boolean);
      render();
    };
    xhr.onerror = xhr.ontimeout = failed;
    xhr.send();
  }
  new ResizeObserver(() => { signature = ''; if (names.length) render(); }).observe(viewport);
  reload();
  setInterval(() => { if (currentMonth().key !== monthKey) reload(); },60000);
  setInterval(reload,5 * 60000);
  document.addEventListener('visibilitychange',() => { if (!document.hidden) reload(); });
})();
</script>
<script>

(()=>{
'use strict';
// Winter months: December, January, February (computer local date).
const WINTER_MONTHS=[11,0,1];
let winterActive=false,snowFrame=0;
const SNOW_INTENSITIES=[.2,.4,.6,.8,1];
const INTENSITY_INTERVAL_MS=3*60*60*1000;
let snowIntensity=1,targetSnowIntensity=1,nextIntensityAt=0;
function updateSnowIntensity(){
 if(!winterActive)return;
 const now=Date.now();
 if(!nextIntensityAt){nextIntensityAt=now+INTENSITY_INTERVAL_MS;return;}
 if(now<nextIntensityAt)return;
 targetSnowIntensity=SNOW_INTENSITIES[Math.floor(Math.random()*SNOW_INTENSITIES.length)];
 nextIntensityAt=now+INTENSITY_INTERVAL_MS;
}
const CONFIG={layers:21,flakesPerLayer:55,minRadius:.7,maxRadius:5.6,depositChance:.72,maxDepth:25,renderScale:.5,alphaThreshold:32};
const scene=document.body,layers=[],targets=[];
const BASE_ACCUMULATION_DEPTH=25;
let accumulationDay='';
function dailyAccumulationFactor(key){
 // A date-seeded draw keeps the day's selection stable even after a page reload.
 let seed=2166136261;
 for(const char of 'snow-depth:'+key){seed=Math.imul(seed^char.charCodeAt(0),16777619);}
 seed^=seed>>>16;seed=Math.imul(seed,0x7feb352d);seed^=seed>>>15;
 return 1+((seed>>>0)%5);
}
function updateSnowAccumulation(){
 const now=new Date();
 const key=now.getFullYear()+'-'+(now.getMonth()+1)+'-'+now.getDate();
 if(key===accumulationDay)return;
 accumulationDay=key;
 CONFIG.maxDepth=BASE_ACCUMULATION_DEPTH*dailyAccumulationFactor(key);
 for(const t of targets){
  for(let i=0;i<t.depths.length;i++)t.depths[i]=Math.min(t.depths[i],CONFIG.maxDepth);
  t.dirty=true;syncTarget(t);
 }
}
updateSnowAccumulation();
// Several depth layers share each integer z-index, preserving page levels 0–7.
const LAYER_Z=Array.from({length:CONFIG.layers},(_,i)=>Math.round(i*7/(CONFIG.layers-1)));
let width=innerWidth,height=innerHeight,paused=false,last=0,layoutClock=0;
const rand=(a,b)=>a+Math.random()*(b-a);
for(let depthIndex=0;depthIndex<CONFIG.layers;depthIndex++){
 const z=LAYER_Z[depthIndex];
 const canvas=document.createElement('canvas');canvas.className='snow-layer';canvas.setAttribute('aria-hidden','true');canvas.style.zIndex=z;canvas.dataset.layer=z;scene.append(canvas);
 layers.push({z,depthIndex,canvas,ctx:canvas.getContext('2d',{alpha:true}),flakes:[],targets:[],phase:rand(0,Math.PI*2),frequency:.25+depthIndex*.031,wind:Math.sin(z*2.399)*12});
}
function spawn(layer,anywhere=false){
 const depth=layer.depthIndex/(CONFIG.layers-1);
 return {x:rand(-30,width+30),y:anywhere?rand(-30,height):-rand(10,120),r:(CONFIG.minRadius+depth*(CONFIG.maxRadius-CONFIG.minRadius))*rand(.75,1.15),speed:rand(24,42)+depth*53,phase:rand(0,Math.PI*2),sway:rand(5,13)+depth*16,age:rand(0,20)};
}
function buildProfile(t,r,style){
 const n=Math.max(1,Math.ceil(r.width));t.base=new Float32Array(n);t.base.fill(NaN);t.depths=new Float32Array(n);t.dirty=true;
 if(t.el.tagName!=='IMG'){t.base.fill(0);return;}
 const img=t.el;if(!img.complete||!img.naturalWidth)return;
 const mask=document.createElement('canvas');mask.width=n;mask.height=Math.max(1,Math.ceil(r.height));
 const c=mask.getContext('2d',{willReadFrequently:true});let dw=r.width,dh=r.height;
 const fit=style.objectFit||'fill',nw=img.naturalWidth,nh=img.naturalHeight;
 if(fit!=='fill'){let scale=fit==='cover'?Math.max(dw/nw,dh/nh):Math.min(dw/nw,dh/nh);if(fit==='none')scale=1;if(fit==='scale-down')scale=Math.min(1,scale);dw=nw*scale;dh=nh*scale;}
 const pos=(style.objectPosition||'50% 50%').split(/\s+/);
 function offset(v,space){if(v==='left'||v==='top')return 0;if(v==='right'||v==='bottom')return space;if(v==='center')return space/2;return v&&v.endsWith('%')?space*parseFloat(v)/100:parseFloat(v)||0;}
 try{c.drawImage(img,offset(pos[0],r.width-dw),offset(pos[1]||'50%',r.height-dh),dw,dh);const pixels=c.getImageData(0,0,mask.width,mask.height).data;
  for(let x=0;x<n;x++)for(let y=0;y<mask.height;y++)if(pixels[(y*n+x)*4+3]>=CONFIG.alphaThreshold){t.base[x]=y;break;}
 }catch(error){console.warn('Snow accumulation disabled: image pixels are not readable.',img.currentSrc||img.src,error);}
}
function syncTarget(t){
 const s=scene.getBoundingClientRect(),r=t.el.getBoundingClientRect(),style=getComputedStyle(t.el);
 t.active=winterActive&&r.width>0&&r.height>0&&style.visibility!=='hidden'&&style.visibility!=='collapse'&&Number(style.opacity)!==0;
 t.x=r.left-s.left;t.y=r.top-s.top;t.width=r.width;
 const key=[Math.ceil(r.width),Math.ceil(r.height),t.el.currentSrc||t.el.src||'',t.el.naturalWidth||0,style.objectFit,style.objectPosition].join('|');
 if(key!==t.profileKey){t.profileKey=key;buildProfile(t,r,style);}
 const w=Math.ceil(r.width+16),h=Math.ceil(r.height+CONFIG.maxDepth+12);
 if(t.canvas.width!==w||t.canvas.height!==h){t.canvas.width=w;t.canvas.height=h;t.dirty=true;}
 t.canvas.style.left=(t.x-8)+'px';t.canvas.style.top=(t.y-CONFIG.maxDepth-8)+'px';t.canvas.style.display=t.active?'block':'none';
}
function refresh(){
 for(const t of targets)t.canvas.remove();targets.length=0;for(const l of layers)l.targets=[];
 for(const el of scene.querySelectorAll('[data-snow]')){
  const z=Number(getComputedStyle(el).zIndex),layer=[...layers].reverse().find(l=>l.z===z);if(!layer||getComputedStyle(el).zIndex==='auto')continue;
  const canvas=document.createElement('canvas');canvas.className='snow-cap';canvas.setAttribute('aria-hidden','true');canvas.style.zIndex=z;scene.append(canvas);
  const t={el,canvas,ctx:canvas.getContext('2d'),depths:new Float32Array(0),dirty:true};targets.push(t);layer.targets.push(t);syncTarget(t);
 }
}
function resize(){width=scene.clientWidth;height=scene.clientHeight;for(const l of layers){l.canvas.width=Math.ceil(width*CONFIG.renderScale);l.canvas.height=Math.ceil(height*CONFIG.renderScale);l.ctx.setTransform(CONFIG.renderScale,0,0,CONFIG.renderScale,0,0);l.flakes=Array.from({length:Math.round(CONFIG.flakesPerLayer*Math.min(2,width*height/(1920*1080)))},()=>spawn(l,true));}targets.forEach(syncTarget);}
function surface(t,x){
 const i=Math.floor(x-t.x);if(i<0||i>=t.base.length||!Number.isFinite(t.base[i]))return Infinity;
 return t.y+t.base[i]-t.depths[i];
}
function deposit(t,x,r){
 const center=Math.min(t.base.length-1,Math.max(0,Math.floor(x-t.x))),spread=Math.max(1,r),base=t.base[center];
 for(let i=Math.max(0,Math.floor(center-spread*3));i<=Math.min(t.depths.length-1,Math.ceil(center+spread*3));i++){
  if(!Number.isFinite(t.base[i])||Math.abs(t.base[i]-base)>Math.max(4,r*2))continue;
  // Do not bridge transparent gaps to a disconnected part of the image.
  let connected=true;for(let k=Math.min(center,i);k<=Math.max(center,i);k++)if(!Number.isFinite(t.base[k])){connected=false;break;}
  if(connected)t.depths[i]=Math.min(CONFIG.maxDepth,t.depths[i]+(.35+r*.19)*Math.exp(-Math.pow((i-center)/spread,2)/2));
 }t.dirty=true;
}
function drawCap(t){
 if(!t.dirty||!t.active)return;t.dirty=false;const c=t.ctx,offset=CONFIG.maxDepth+8;c.clearRect(0,0,t.canvas.width,t.canvas.height);
 // Each pixel column has its own edge: empty columns never draw snow.
 c.fillStyle='#edf7fc';for(let i=0;i<t.depths.length;i++)if(Number.isFinite(t.base[i])&&t.depths[i]>.01)c.fillRect(8+i,offset+t.base[i]-t.depths[i],1,t.depths[i]);
}
function frame(time){if(!winterActive)return;snowFrame=requestAnimationFrame(frame);if(!last){last=time;return;}const dt=Math.min((time-last)/1000,.05);last=time;if(paused||document.hidden)return;
 // Ease toward the new density over roughly one minute. Full density remains the original maximum.
 const intensityStep=dt/60;
 snowIntensity+=Math.sign(targetSnowIntensity-snowIntensity)*Math.min(Math.abs(targetSnowIntensity-snowIntensity),intensityStep);
 layoutClock+=dt;if(layoutClock>.25){targets.forEach(syncTarget);layoutClock=0;}
 for(const l of layers){const c=l.ctx;c.clearRect(0,0,width+2,height+2);c.fillStyle=`rgba(243,249,255,${.35+l.depthIndex/20*.58})`;c.beginPath();
  for(let i=0,count=Math.round(l.flakes.length*snowIntensity);i<count;i++){
   let f=l.flakes[i];const ox=f.x,oy=f.y;f.age+=dt;
   f.x+=(l.wind+Math.sin(f.age*l.frequency+f.phase+l.phase)*f.sway+Math.sin(time*.00013+l.phase)*9)*dt;f.y+=f.speed*dt;
   let hit=null,hitX=0,hitY=Infinity;
   for(const t of l.targets){if(!t.active)continue;const sy=surface(t,f.x);if(oy+f.r<=sy&&f.y+f.r>=sy){const fraction=Math.max(0,Math.min(1,(sy-f.r-oy)/(f.y-oy))),x=ox+(f.x-ox)*fraction;if(x>=t.x&&x<=t.x+t.width&&sy<hitY){hit=t;hitX=x;hitY=sy;}}}
   if(hit&&Math.random()<CONFIG.depositChance){deposit(hit,hitX,f.r);f=l.flakes[i]=spawn(l);}
   if(f.y-f.r>height)f=l.flakes[i]=spawn(l);if(f.x<-40)f.x=width+35;if(f.x>width+40)f.x=-35;
   c.moveTo(f.x+f.r,f.y);c.arc(f.x,f.y,f.r,0,Math.PI*2);
  }c.fill();
 }targets.forEach(drawCap);
}
function updateSnowSeason(){
 const active=WINTER_MONTHS.includes(new Date().getMonth());
 if(active===winterActive){
  for(const l of layers)l.canvas.style.display=active?'block':'none';
  return;
 }
 winterActive=active;last=0;
 for(const l of layers)l.canvas.style.display=active?'block':'none';
 if(active){
  snowIntensity=targetSnowIntensity=1;nextIntensityAt=0;updateSnowIntensity();
  targets.forEach(syncTarget);
  snowFrame=requestAnimationFrame(frame);
 }else{
  cancelAnimationFrame(snowFrame);snowFrame=0;
  for(const t of targets){t.depths.fill(0);t.dirty=true;t.canvas.style.display='none';}
 }
}
window.Snowfall={refresh,clear(){for(const t of targets){t.depths.fill(0);t.dirty=true;}},pause(value=true){paused=value;}};
const pauseButton=document.getElementById('pause'),clearButton=document.getElementById('clear');
if(pauseButton)pauseButton.onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume snow':'Pause snow';};if(clearButton)clearButton.onclick=()=>Snowfall.clear();
window.addEventListener('resize',resize);scene.addEventListener('load',event=>{if(event.target.matches?.('[data-snow]'))refresh();},true);refresh();resize();updateSnowSeason();
setInterval(()=>{updateSnowAccumulation();updateSnowSeason();updateSnowIntensity();},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){updateSnowAccumulation();updateSnowSeason();updateSnowIntensity();}});
})();

</script>
<script>
// Reload fixed leadership filenames independently of the page and other media.
(() => {
  'use strict';
  const INTERVAL = 5 * 60 * 1000;
  const entries = [...document.querySelectorAll('img[class^="img-L"]')].map(el => ({
    el, source:el.getAttribute('src'), signature:null, pixelSignature:null, objectURL:null, busy:false
  }));
  async function pixelFingerprint(image) {
    // Native resolution, no resizing or tolerance: preserve even one-pixel text edits.
    const canvas=document.createElement('canvas');
    canvas.width=image.naturalWidth;canvas.height=image.naturalHeight;
    try {
      const context=canvas.getContext('2d',{willReadFrequently:true});
      context.drawImage(image,0,0);
      const pixels=context.getImageData(0,0,canvas.width,canvas.height).data;
      const digest=await crypto.subtle.digest('SHA-256',pixels);
      return canvas.width+'x'+canvas.height+':'+[...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
    } finally {
      canvas.width=canvas.height=0;
    }
  }
  async function check(entry) {
    if (entry.busy) return;
    entry.busy = true;
    let newURL = null;
    try {
      const bytes = await new Promise((resolve,reject) => {
        const xhr = new XMLHttpRequest();
        const url = new URL(entry.source,document.baseURI);
        url.searchParams.set('leadershipRefresh',Date.now());
        xhr.open('GET',url.href,true);xhr.responseType='arraybuffer';xhr.timeout=30000;
        xhr.onload=()=>{
          if ((xhr.status===0 || (xhr.status>=200 && xhr.status<300)) && xhr.response?.byteLength) resolve(xhr.response);
          else reject(new Error('Image unavailable'));
        };
        xhr.onerror=xhr.ontimeout=()=>reject(new Error('Image read failed'));
        xhr.send();
      });
      const digest = await crypto.subtle.digest('SHA-256',bytes);
      const signature = [...new Uint8Array(digest)].map(n=>n.toString(16).padStart(2,'0')).join('');
      if (signature===entry.signature) return;
      newURL=URL.createObjectURL(new Blob([bytes],{type:'image/png'}));
      const replacement=new Image();
      for (const attr of entry.el.attributes) {
        if (attr.name!=='src') replacement.setAttribute(attr.name,attr.value);
      }
      await new Promise((resolve,reject)=>{
        const timeout=setTimeout(()=>reject(new Error('Image decode timed out')),30000);
        replacement.onload=()=>{clearTimeout(timeout);resolve();};
        replacement.onerror=()=>{clearTimeout(timeout);reject(new Error('Image is incomplete or damaged'));};
        replacement.src=newURL;
      });
      if(replacement.decode) await replacement.decode();
      const pixelSignature=await pixelFingerprint(replacement);
      if(pixelSignature===entry.pixelSignature){
        // Remember the new encoding without disturbing the displayed image or snow.
        entry.signature=signature;
        return;
      }
      const oldURL=entry.objectURL;
      entry.el.replaceWith(replacement);
      entry.el=replacement;entry.signature=signature;entry.pixelSignature=pixelSignature;entry.objectURL=newURL;newURL=null;
      // Notify the existing snow handler so accumulation follows the new image outline.
      replacement.dispatchEvent(new Event('load'));
      if(oldURL) requestAnimationFrame(()=>requestAnimationFrame(()=>URL.revokeObjectURL(oldURL)));
    } catch(error) {
      console.warn('Keeping existing leadership image:',entry.source,error.message);
    } finally {
      if(newURL) URL.revokeObjectURL(newURL);
      entry.busy=false;
    }
  }
  // Check sequentially to limit memory and decoding load alongside the 4K slideshow.
  let checking=false;
  async function checkAll(){
    if(checking)return;checking=true;
    try{for(const entry of entries)await check(entry);}finally{checking=false;}
  }
  checkAll();
  setInterval(checkAll,INTERVAL);
})();
</script>

<script id="leadership-plaque-csv-script">
/* CSV setup: put Leadership.csv beside index.html, or change csvUrl below
   to a published Google Sheets CSV URL. Columns:
   Plaque,Line1,Line2
   L1,"Rank First Last","Duty title"
   ...through L8. Plaque IDs match the image classes, not their source slide order.
   Quoted commas, doubled quotes, UTF-8 BOM, CRLF and quoted newlines are supported.
   Fields are displayed as plain text. Missing L1–L8 rows display blank plaques. */
(() => {
 'use strict';
 const CONFIG = {
  csvUrl: 'Leadership.csv',
  refreshMilliseconds: 60 * 1000
 };
 const plaques = [...document.querySelectorAll('[data-plaque]')];
 const fields = plaques.flatMap(panel => [...panel.querySelectorAll('.leadership-plaque-line>span')]);
 let pendingFit = 0, busy = false, previousCSV = null;
 function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];let row = [], field = '', quoted = false, closed = false;
  const finishField = () => {row.push(field);field = '';closed = false;};
  const finishRow = () => {finishField();rows.push(row);row = [];};
  for (let i = 0; i < text.length; i++) {
   const c = text[i];
   if (quoted) {
    if (c === '"') {
     if (text[i + 1] === '"') {field += '"';i++;}
     else {quoted = false;closed = true;}
    } else field += c;
   } else if (c === '"' && !field && !closed) quoted = true;
   else if (c === ',') finishField();
   else if (c === '\n' || c === '\r') {
    if (c === '\r' && text[i + 1] === '\n') i++;
    finishRow();
   } else if (closed && /\s/.test(c)) continue;
   else if (closed || c === '"') throw new Error('Malformed CSV field');
   else field += c;
  }
  if (quoted) throw new Error('Incomplete quoted CSV field');
  if (field || row.length || closed) finishRow();
  return rows.filter(row => row.some(value => value.trim()));
 }
 function decodePlaques(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('CSV is empty');
  const headers = rows.shift().map(value => value.trim().toLowerCase());
  const idColumn = headers.indexOf('plaque');
  const firstColumn = headers.indexOf('line1');
  const secondColumn = headers.indexOf('line2');
  if ([idColumn,firstColumn,secondColumn].some(index => index < 0))
   throw new Error('Expected CSV headers: Plaque,Line1,Line2');
  const values = new Map();
  const singleLine = value => (value || '').replace(/\s+/g,' ').trim();
  for (const row of rows) {
   const id = (row[idColumn] || '').trim().toUpperCase();
   if (!/^L[1-8]$/.test(id)) throw new Error('Invalid plaque ID: ' + id);
   if (values.has(id)) throw new Error('Duplicate plaque ID: ' + id);
   values.set(id,[singleLine(row[firstColumn]),singleLine(row[secondColumn])]);
  }
  return values;
 }
 function setSize(size) {
  document.documentElement.style.setProperty('--leadership-plaque-font-size', size + 'px');
 }
 function fits() {
  return fields.every(span => {
   if (!span.textContent) return true;
   const box = span.parentElement.getBoundingClientRect();
   const text = span.getBoundingClientRect();
   // A small inset also keeps the text shadow safely inside the text field.
   return text.width <= Math.max(0,box.width - 2) && text.height <= Math.max(0,box.height - 2);
  });
 }
 function fitAll() {
  pendingFit = 0;
  const active = fields.filter(span => span.textContent && span.parentElement.clientHeight);
  if (!active.length) {setSize(0);return;}
  // Always start with the maximum available height, without a fixed font-size cap.
  // Long text reduces the same size
  // for every line on every plaque; no individual scaling or wrapping occurs.
  let low = 0;
  let high = Math.min(...active.map(span => span.parentElement.getBoundingClientRect().height / 1.05));
  for (let i = 0; i < 20; i++) {
   const trial = (low + high) / 2;
   setSize(trial);
   if (fits()) low = trial; else high = trial;
  }
  setSize(Math.max(0,low - 0.02));
 }
 function scheduleFit() {
  if (!pendingFit) pendingFit = requestAnimationFrame(fitAll);
 }
 function readCSV() {
  return new Promise((resolve,reject) => {
   const xhr = new XMLHttpRequest();
   const url = new URL(CONFIG.csvUrl,document.baseURI);
   url.searchParams.set('_plaqueUpdate',Date.now());
   xhr.open('GET',url.href,true);xhr.timeout = 20000;
   xhr.onload = () => {
    if ((xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) && xhr.responseText.trim())
     resolve(xhr.responseText);
    else reject(new Error('Plaque CSV unavailable (status ' + xhr.status + ')'));
   };
   xhr.onerror = () => reject(new Error('Plaque CSV could not be read'));
   xhr.ontimeout = () => reject(new Error('Plaque CSV read timed out'));
   xhr.send();
  });
 }
 async function refresh() {
  if (busy) return;
  busy = true;
  try {
   const csv = await readCSV();
   if (csv === previousCSV) return;
   const values = decodePlaques(csv);
   // Validate the complete CSV before changing any visible plaque.
   for (const panel of plaques) {
    const lines = values.get(panel.dataset.plaque) || ['',''];
    panel.querySelectorAll('.leadership-plaque-line>span').forEach((span,i) => {
     span.textContent = lines[i];
    });
   }
   fitAll();previousCSV = csv;
  } catch (error) {
   // A failed or partial download retains the last successful text and size.
   console.warn('Keeping existing leadership plaque text:',error.message);
  } finally {busy = false;}
 }
 if ('ResizeObserver' in window) {
  const observer = new ResizeObserver(scheduleFit);
  plaques.forEach(panel => observer.observe(panel));
 }
 window.addEventListener('resize',scheduleFit);
 if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone',scheduleFit);
 }
 document.addEventListener('visibilitychange',() => {
  if (!document.hidden) {scheduleFit();refresh();}
 });
 window.LeadershipPlaques = {refresh,fit:scheduleFit};
 refresh();setInterval(refresh,CONFIG.refreshMilliseconds);
})();
</script>
