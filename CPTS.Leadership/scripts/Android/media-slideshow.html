<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pictures and videos</title>
<link rel="stylesheet" href="./scripts/swiper-11-bundle.min.css">
<link rel="stylesheet" href="./scripts/swiper-gl.min.css">
<style>
html,body { margin:0!important; padding:0!important; width:100%; height:100%; overflow:hidden; background:transparent!important; }
#media-panel { position:fixed; top:0; right:0; width:50vw; height:50vh; background:transparent; overflow:hidden; pointer-events:none; }
#media-panel .swiper { width:100%; height:100%; overflow:visible; background:transparent; }
#media-panel .swiper-slide { display:flex; align-items:center; justify-content:center; background:transparent!important; overflow:hidden; }
#media-panel .media-content { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
#media-panel img,#media-panel video { display:block; width:100%; height:100%; min-width:0; min-height:0; object-fit:contain; background:transparent; pointer-events:none; user-select:none; }
#live-media { position:absolute; inset:0; }
#gl-transition { position:absolute; inset:0; visibility:hidden; }
#media-panel .swiper-gl-image { display:none!important; }
</style>
</head>
<body>
<section id="media-panel" aria-label="Picture and video slideshow"><div id="live-media"></div><div id="gl-transition" class="swiper"><div class="swiper-wrapper"></div></div></section>
<script src="./scripts/swiper-11-bundle.min.js"></script>
<script src="./scripts/swiper-gl.min.js"></script>
<script src="./scripts/media-slideshow.js"></script>
</body>
</html>
