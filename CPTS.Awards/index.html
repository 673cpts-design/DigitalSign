<script>

const Swiper6 = window.Swiper;
window.Swiper = Swiper11;
const templates = {"quarter": "        <div class=\"swiper-slide swiper-slide-4ffe\">\n\n            <img\n                class=\"swiper-slide-bg-image swiper-slide-bg-image-bdb6\"\n\n                data-swiper-parallax=\"39%\"\n\n                src=\"images/american-flag-840.png\"\n\n                alt=\"\"\n\n                draggable=\"false\"\n\n                decoding=\"async\"\n            />\n\n\n            <div class=\"swiper-slide-content swiper-slide-content-2f5e\">\n\n                <img\n                    class=\"swiper-slide-image swiper-slide-image-9428\"\n\n                    data-swiper-parallax=\"-390\"\n\n                    data-swiper-parallax-scale=\"1.15\"\n\n                    data-swiper-parallax-opacity=\"0.6\"\n\n                    src=\"@@SRC@@\"\n\n                    alt=\"\"\n\n                    draggable=\"false\"\n\n                    decoding=\"async\"\n                />\n\n            </div>\n\n        </div>", "who": "        <div class=\"swiper-slide swiper-slide-5215\">\n          <img\n            class=\"swiper-slide-bg-image swiper-slide-bg-image-bdb6 swiper-gl-image\"\n            src=\"@@SRC@@\"\n          />\n\n          <div class=\"swiper-slide-content swiper-slide-content-94be\"></div>\n        </div>", "year": "    <div class=\"swiper-slide\">\n      <figure class=\"slide-bgimg\" style=\"background-image:url('@@SRC@@')\" data-swiper-parallax-x=\"80%\">\n        <img src=\"@@SRC@@\" class=\"entity-img\" />\n      </figure>\n    </div>", "sidebar": "    <div class=\"swiper-slide\">\n      <figure class=\"slide-bgimg\" style=\"background-image:url('@@SRC@@')\">\n        <img src=\"@@SRC@@\" class=\"entity-img\" />\n      </figure>\n    </div>"};
const regions = [
 ['Quarter1','#quarter-1 .swiper-wrapper','quarter'],
 ['Quarter2','#quarter-2 .swiper-wrapper','quarter'],
 ['Quarter3','#quarter-3 .swiper-wrapper','quarter'],
 ['Quarter4','#quarter-4 .swiper-wrapper','quarter'],
 ['Who','#who-panel .swiper-wrapper','who'],
 ['Year','#year-panel .main-slider .swiper-wrapper','year'],
 ['YearSideBar','#year-panel .nav-slider .swiper-wrapper','sidebar']
];
const fixedImages = [...document.querySelectorAll('body > img')].map(el => [el,el.getAttribute('src')]);
let busy = false, appliedVersion = null;
function imageExists(src) {
 return new Promise((resolve,reject) => {
  const image = new Image();
  const timer = setTimeout(() => { image.onload=image.onerror=null; reject(new Error('Image timed out: '+src)); },15000);
  image.onload = () => { clearTimeout(timer); resolve(true); };
  image.onerror = () => { clearTimeout(timer); resolve(false); };
  image.src = src;
 });
}
function fresh(src,version) { return src+'?v='+encodeURIComponent(version); }
async function discover(folder,version) {
 const files=[];
 // Sequential exports: stop at the first absent PNG. No fixed slide-count limit.
 for(let n=0;;n++) {
  const src=fresh('./images/'+folder+'/slide-'+String(n).padStart(3,'0')+'.png',version);
  if(!await imageExists(src)) return files;
  files.push(src);
 }
}
function initializePresentations() {

window.Swiper = Swiper11;
for (const panel of document.querySelectorAll('.quarter-panel')) {
if (panel.querySelector('.swiper-slide')) {
new Swiper11(panel.querySelector(".swiper"), {

    /*
        Keep the existing automatic-height behavior so this remains
        visually compatible with the current implementation.
    */
    autoHeight: true,


    /*
        Continuous looping is required for kiosk operation.
    */
    loop: true,


    /*
        Main visual transition.
    */
    effect: "cube",


    /*
        Explicitly retain cube shadows.

        These are part of the desired visual presentation.
    */
    cubeEffect: {
        shadow: true,
        slideShadows: true
    },


    /*
        Original transition duration.
    */
    speed: 800,


    /*
        Explicit autoplay configuration.

        Swiper's normal autoplay delay is 3000ms, so specifying it
        keeps the current timing predictable.
    */
    autoplay: {
        delay: 3000,
        disableOnInteraction: false,
        pauseOnMouseEnter: false
    },


    /*
        Required for the visual parallax effects.
    */
    parallax: {
        enabled: true
    },


    /*
        Required by Swiper for accurate progress-dependent effects.
    */
    watchSlidesProgress: true,


    /*
        Kiosk geometry is static.

        Prevent continuous ResizeObserver bookkeeping. The page is
        loaded at its final kiosk dimensions and does not need to
        respond to DOM resizing.
    */
    resizeObserver: false,


    /*
        Do not repeatedly update Swiper for window resize events.

        This avoids unnecessary measurements/recalculation on a

    */
    updateOnWindowResize: false,

        Touch interaction is unnecessary on an unattended display.
        Disabling it avoids installing/processing gesture work while
        autoplay continues normally.
    */
    allowTouchMove: false

});



}
}

const whoSwiper = new Swiper11("#who-panel .swiper", {

      });
    
}

const mainSlider = new Swiper6('#year-panel .main-slider', {

  });

  mainSlider.controller.control = navSlider;
  navSlider.controller.control = mainSlider;

}

}
async function refreshPresentations(version) {
 busy=true;
 try {
  // Keep the old slides playing until discovery and preloading finish.
  const lists=await Promise.all(regions.map(r=>discover(r[0],version)));
  const fixed=await Promise.all(fixedImages.map(async ([el,src])=>[el,fresh(src,version),await imageExists(fresh(src,version))]));
  // If another completion arrived, discard this stale result and retry next check.
  if(window.awardsContentVersion && window.awardsContentVersion!==version) return;
  for(const el of document.querySelectorAll('.slider-panel .swiper, .slider-panel .swiper-container')) {
   if(el.swiper && !el.swiper.destroyed) el.swiper.destroy(true,true);
  }
  regions.forEach((r,i)=>{
   document.querySelector(r[1]).innerHTML=lists[i].map(src=>templates[r[2]].replaceAll('@@SRC@@',src)).join('');
  });
  fixed.forEach(([el,src,exists])=>{ if(exists) { el.src=src; el.hidden=false; } else { el.hidden=true; } });
  initializePresentations();
  appliedVersion=version;
  console.info('Presentations updated:',version,lists.map((list,i)=>regions[i][0]+': '+list.length).join(', '));
 } catch(error) { console.error('Presentation update failed; retrying on next signal check.',error); }
 finally { busy=false; }
}
function readSignal() {
 return new Promise(resolve=>{
  const script=document.createElement('script');
  const finish=()=>{ clearTimeout(timer); script.remove(); resolve(); };
  const timer=setTimeout(finish,5000);
  script.onload=script.onerror=finish;
  // A classic local script works with file://; fetch() is intentionally avoided.
  script.src='./content-version.js?check='+Date.now();
  document.head.appendChild(script);
 });
}
async function checkSignal() {
 await readSignal();
 const version=window.awardsContentVersion || startupVersion;
 if(!busy && version!==appliedVersion) await refreshPresentations(version);
 setTimeout(checkSignal,2000);
}
const startupVersion='startup-'+Date.now();
document.addEventListener('dragstart',event=>event.preventDefault());
checkSignal();
