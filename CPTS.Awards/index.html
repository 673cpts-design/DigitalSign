<script>const Swiper11 = window.Swiper;</script>

<script>

const Swiper6 = window.Swiper;
window.Swiper = Swiper11;
const templates = {"quarter": "        <div class=\"swiper-slide swiper-slide-4ffe\">\n\n            <img\n                class=\"swiper-slide-bg-image swiper-slide-bg-image-bdb6\"\n\n                data-swiper-parallax=\"39%\"\n\n                src=\"images/american-flag-840.png\"\n\n                alt=\"\"\n\n                draggable=\"false\"\n\n                decoding=\"async\"\n            />\n\n\n            <div class=\"swiper-slide-content swiper-slide-content-2f5e\">\n\n                <img\n                    class=\"swiper-slide-image swiper-slide-image-9428\"\n\n                    data-swiper-parallax=\"-390\"\n\n                    data-swiper-parallax-scale=\"1.15\"\n\n                    data-swiper-parallax-opacity=\"0.6\"\n\n                    src=\"@@SRC@@\"\n\n                    alt=\"\"\n\n                    draggable=\"false\"\n\n                    decoding=\"async\"\n                />\n\n            </div>\n\n        </div>", "who": "        <div class=\"swiper-slide swiper-slide-5215\">\n          <img\n            class=\"swiper-slide-bg-image swiper-slide-bg-image-bdb6 swiper-gl-image\"\n            src=\"@@SRC@@\"\n          />\n\n          <div class=\"swiper-slide-content swiper-slide-content-94be\"></div>\n        </div>", "year": "    <div class=\"swiper-slide\">\n      <figure class=\"slide-bgimg\" style=\"background-image:url('@@SRC@@')\" data-swiper-parallax-x=\"80%\">\n        <img src=\"@@SRC@@\" class=\"entity-img\" />\n      </figure>\n    </div>", "sidebar": "    <div class=\"swiper-slide\">\n      <figure class=\"slide-bgimg\" style=\"background-image:url('@@SRC@@')\">\n        <img src=\"@@SRC@@\" class=\"entity-img\" />\n      </figure>\n    </div>"};
const regions = [
 ['Quarter1','#quarter-1 .swiper-wrapper','quarter'],
 ['Quarter2','#quarter-2 .swiper-wrapper','quarter'],
 ['Quarter3','#quarter-3 .swiper-wrapper','quarter'],
 ['Quarter4','#quarter-4 .swiper-wrapper','quarter'],
 ['Who','#who-panel .swiper-wrapper','who'],
 ['Year','#year-panel .main-slider .swiper-wrapper','year'],
 ['YearSideBar','#year-panel .nav-slider .swiper-wrapper','sidebar']
];
const fixedImages = [...document.querySelectorAll('body > img')].map(el => [el,el.getAttribute('src')]);
let busy = false, appliedVersion = null;
function imageExists(src) {
 return new Promise((resolve,reject) => {
  const image = new Image();
  const timer = setTimeout(() => { image.onload=image.onerror=null; reject(new Error('Image timed out: '+src)); },15000);
  image.onload = () => { clearTimeout(timer); resolve(true); };
  image.onerror = () => { clearTimeout(timer); resolve(false); };
  image.src = src;
 });
}
function fresh(src,version) { return src+'?v='+encodeURIComponent(version); }
async function discover(folder,version) {
 const files=[];
 // Sequential exports: stop at the first absent PNG. No fixed slide-count limit.
 for(let n=0;;n++) {
  const src=fresh('./images/'+folder+'/slide-'+String(n).padStart(3,'0')+'.png',version);
  if(!await imageExists(src)) return files;
  files.push(src);
 }
}
function initializePresentations() {

window.Swiper = Swiper11;
for (const panel of document.querySelectorAll('.quarter-panel')) {
if (panel.querySelector('.swiper-slide')) {
const cubeElement = panel.querySelector('.swiper');
const cubeImages = [...panel.querySelectorAll('.swiper-slide-image-9428')];
// Cube geometry must exist before Swiper measures and transforms its faces.
// Use the exported slide aspect ratio and retain the original 48px inset.
const referenceImage = cubeImages.find(image => image.naturalWidth > 0 && image.naturalHeight > 0);
const cubeWidth = cubeElement.clientWidth || 600;
const availableHeight = panel.clientHeight || 1080;
const cubeHeight = referenceImage
    ? Math.min(availableHeight, Math.round((cubeWidth - 96) * referenceImage.naturalHeight / referenceImage.naturalWidth + 96))
    : cubeWidth;
cubeElement.style.height = Math.max(97, cubeHeight) + 'px';
new Swiper11(cubeElement, {

    /*
        The cube needs stable dimensions before its first render.
        Its height above already follows the exported slide aspect ratio.
    */
    autoHeight: false,


    /*
        Continuous looping is required for kiosk operation.
    */
    loop: cubeImages.length > 1,


    /*
        Main visual transition.
    */
    effect: "cube",


    /*
        Explicitly retain cube shadows.

        These are part of the desired visual presentation.
    */
    cubeEffect: {
        shadow: true,
        slideShadows: true
    },


    /*
        Original transition duration.
    */
    speed: 800,


    /*
        Explicit autoplay configuration.

        Swiper's normal autoplay delay is 3000ms, so specifying it
        keeps the current timing predictable.
    */
    autoplay: {
        delay: 3000,
        disableOnInteraction: false,
        pauseOnMouseEnter: false
    },


    /*
        Required for the visual parallax effects.
    */
    parallax: {
        enabled: true
    },


    /*
        Required by Swiper for accurate progress-dependent effects.
    */
    watchSlidesProgress: true,


    /*
        Kiosk geometry is static.

        Prevent continuous ResizeObserver bookkeeping. The page is
        loaded at its final kiosk dimensions and does not need to
        respond to DOM resizing.
    */
    resizeObserver: false,


    /*
        Do not repeatedly update Swiper for window resize events.

        This avoids unnecessary measurements/recalculation on a
        fixed-size kiosk display.
    */
    updateOnWindowResize: false,


    /*
        Touch interaction is unnecessary on an unattended display.
        Disabling it avoids installing/processing gesture work while
        autoplay continues normally.
    */
    allowTouchMove: false

});



}
}
if (document.querySelector('#who-panel .swiper-slide')) {
const whoSwiper = new Swiper11("#who-panel .swiper", {
        modules: [SwiperGL],
        effect: "gl",
        creativeEffect: {
          limitProgress: 5,
          prev: { shadow: true },
          next: { shadow: true },
        },
        speed: 1200,
        autoplay: { enabled: true },
        watchSlidesProgress: true,
      });
    
}
if (document.querySelector('#year-panel .main-slider .swiper-slide') &&
    document.querySelector('#year-panel .nav-slider .swiper-slide')) {
const mainSlider = new Swiper6('#year-panel .main-slider', {
    loop: true,
    speed: 1000,
    parallax: true,
    autoplay: {
      delay: 14000,
      disableOnInteraction: false
    },
    loopAdditionalSlides: 10,
    grabCursor: false,
    allowTouchMove: false,
    simulateTouch: false,
    keyboard: { enabled: false },
    mousewheel: false
  });

  const navSlider = new Swiper6('#year-panel .nav-slider', {
    loop: true,
    loopAdditionalSlides: 10,
    speed: 1000,
    spaceBetween: 5,
    slidesPerView: 5,
    centeredSlides: true,
    direction: 'vertical',
    allowTouchMove: false,
    simulateTouch: false,
    slideToClickedSlide: false
  });

  mainSlider.controller.control = navSlider;
  navSlider.controller.control = mainSlider;

}

}
function waitForCubeImage(image) {
 return new Promise((resolve, reject) => {
  const finish = (error) => {
   clearTimeout(timer);
   image.removeEventListener('load', loaded);
   image.removeEventListener('error', failed);
   error ? reject(error) : resolve();
  };
  const loaded = () => {
   if (typeof image.decode === 'function') image.decode().then(() => finish(), () => finish());
   else finish();
  };
  const failed = () => finish(new Error('Cube image failed to load: ' + image.src));
  const timer = setTimeout(() => finish(new Error('Cube image timed out: ' + image.src)), 15000);
  image.addEventListener('load', loaded, {once:true});
  image.addEventListener('error', failed, {once:true});
  if (image.complete) image.naturalWidth > 0 ? loaded() : failed();
 });
}
async function refreshPresentations(version) {
 busy=true;
 try {
  // Keep the old slides playing until discovery and preloading finish.
  const lists=await Promise.all(regions.map(r=>discover(r[0],version)));
  const fixed=await Promise.all(fixedImages.map(async ([el,src])=>[el,fresh(src,version),await imageExists(fresh(src,version))]));
  // If another completion arrived, discard this stale result and retry next check.
  if(window.awardsContentVersion && window.awardsContentVersion!==version) return;
  for(const el of document.querySelectorAll('.slider-panel .swiper, .slider-panel .swiper-container')) {
   if(el.swiper && !el.swiper.destroyed) el.swiper.destroy(true,true);
  }
  regions.forEach((r,i)=>{
   document.querySelector(r[1]).innerHTML=lists[i].map(src=>templates[r[2]].replaceAll('@@SRC@@',src)).join('');
  });
  fixed.forEach(([el,src,exists])=>{ if(exists) { el.src=src; el.hidden=false; } else { el.hidden=true; } });
  // Preloading a separate Image object does not guarantee the newly inserted
  // DOM images are decoded yet. Wait for the actual cube face images as well.
  await Promise.all([...document.querySelectorAll('.quarter-panel img')].map(waitForCubeImage));
  await new Promise(resolve => requestAnimationFrame(resolve));
  initializePresentations();
  appliedVersion=version;
  console.info('Presentations updated:',version,lists.map((list,i)=>regions[i][0]+': '+list.length).join(', '));
 } catch(error) { console.error('Presentation update failed; retrying on next signal check.',error); }
 finally { busy=false; }
}
function readSignal() {
 return new Promise(resolve=>{
  const script=document.createElement('script');
  const finish=()=>{ clearTimeout(timer); script.remove(); resolve(); };
  const timer=setTimeout(finish,5000);
  script.onload=script.onerror=finish;
  // A classic local script works with file://; fetch() is intentionally avoided.
  script.src='./content-version.js?check='+Date.now();
  document.head.appendChild(script);
 });
}
async function checkSignal() {
 await readSignal();
 const version=window.awardsContentVersion || startupVersion;
 if(!busy && version!==appliedVersion) await refreshPresentations(version);
 setTimeout(checkSignal,2000);
}
const startupVersion='startup-'+Date.now();
document.addEventListener('dragstart',event=>event.preventDefault());
checkSignal();

</script><script id="leadership-plaque-csv-script">
/* CSV setup: put Leadership.csv beside index.html, or change csvUrl below
   to a published Google Sheets CSV URL. Columns:
   Plaque,Line1,Line2
   L1,"Rank First Last","Duty title"
   ...through L4. Plaque IDs match the image classes, not their source slide order.
   Quoted commas, doubled quotes, UTF-8 BOM, CRLF and quoted newlines are supported.
   Fields are displayed as plain text. Missing L1–L4 rows display blank plaques. */
(() => {
 'use strict';
 const CONFIG = {
  csvUrl: 'Leadership.csv',
  refreshMilliseconds: 60 * 1000
 };
 const plaques = [...document.querySelectorAll('[data-plaque]')];
 const fields = plaques.flatMap(panel => [...panel.querySelectorAll('.leadership-plaque-line>span')]);
 let pendingFit = 0, busy = false, previousCSV = null;
 function parseCSV(text) {
  text = text.replace(/^\uFEFF/, '');
  const rows = [];let row = [], field = '', quoted = false, closed = false;
  const finishField = () => {row.push(field);field = '';closed = false;};
  const finishRow = () => {finishField();rows.push(row);row = [];};
  for (let i = 0; i < text.length; i++) {
   const c = text[i];
   if (quoted) {
    if (c === '"') {
     if (text[i + 1] === '"') {field += '"';i++;}
     else {quoted = false;closed = true;}
    } else field += c;
   } else if (c === '"' && !field && !closed) quoted = true;
   else if (c === ',') finishField();
   else if (c === '\n' || c === '\r') {
    if (c === '\r' && text[i + 1] === '\n') i++;
    finishRow();
   } else if (closed && /\s/.test(c)) continue;
   else if (closed || c === '"') throw new Error('Malformed CSV field');
   else field += c;
  }
  if (quoted) throw new Error('Incomplete quoted CSV field');
  if (field || row.length || closed) finishRow();
  return rows.filter(row => row.some(value => value.trim()));
 }
 function decodePlaques(text) {
  const rows = parseCSV(text);
  if (!rows.length) throw new Error('CSV is empty');
  const headers = rows.shift().map(value => value.trim().toLowerCase());
  const idColumn = headers.indexOf('plaque');
  const firstColumn = headers.indexOf('line1');
  const secondColumn = headers.indexOf('line2');
  if ([idColumn,firstColumn,secondColumn].some(index => index < 0))
   throw new Error('Expected CSV headers: Plaque,Line1,Line2');
  const values = new Map();
  const singleLine = value => (value || '').replace(/\s+/g,' ').trim();
  for (const row of rows) {
   const id = (row[idColumn] || '').trim().toUpperCase();
   if (!/^L[1-4]$/.test(id)) throw new Error('Invalid plaque ID: ' + id);
   if (values.has(id)) throw new Error('Duplicate plaque ID: ' + id);
   values.set(id,[singleLine(row[firstColumn]),singleLine(row[secondColumn])]);
  }
  return values;
 }
 function setSize(size) {
  document.documentElement.style.setProperty('--leadership-plaque-font-size', size + 'px');
 }
 function fits() {
  return fields.every(span => {
   if (!span.textContent) return true;
   const box = span.parentElement.getBoundingClientRect();
   const text = span.getBoundingClientRect();
   // A small inset also keeps the text shadow safely inside the text field.
   return text.width <= Math.max(0,box.width - 2) && text.height <= Math.max(0,box.height - 2);
  });
 }
 function fitAll() {
  pendingFit = 0;
  const active = fields.filter(span => span.textContent && span.parentElement.clientHeight);
  if (!active.length) {setSize(0);return;}
  // Always start with the maximum available height, without a fixed font-size cap.
  // Long text reduces the same size
  // for every line on every plaque; no individual scaling or wrapping occurs.
  let low = 0;
  let high = Math.min(...active.map(span => span.parentElement.getBoundingClientRect().height / 1.05));
  for (let i = 0; i < 20; i++) {
   const trial = (low + high) / 2;
   setSize(trial);
   if (fits()) low = trial; else high = trial;
  }
  setSize(Math.max(0,low - 0.02));
 }
 function scheduleFit() {
  if (!pendingFit) pendingFit = requestAnimationFrame(fitAll);
 }
 function readCSV() {
  return new Promise((resolve,reject) => {
   const xhr = new XMLHttpRequest();
   const url = new URL(CONFIG.csvUrl,document.baseURI);
   url.searchParams.set('_plaqueUpdate',Date.now());
   xhr.open('GET',url.href,true);xhr.timeout = 20000;
   xhr.onload = () => {
    if ((xhr.status === 0 || (xhr.status >= 200 && xhr.status < 300)) && xhr.responseText.trim())
     resolve(xhr.responseText);
    else reject(new Error('Plaque CSV unavailable (status ' + xhr.status + ')'));
   };
   xhr.onerror = () => reject(new Error('Plaque CSV could not be read'));
   xhr.ontimeout = () => reject(new Error('Plaque CSV read timed out'));
   xhr.send();
  });
 }
 async function refresh() {
  if (busy) return;
  busy = true;
  try {
   const csv = await readCSV();
   if (csv === previousCSV) return;
   const values = decodePlaques(csv);
   // Validate the complete CSV before changing any visible plaque.
   for (const panel of plaques) {
    const lines = values.get(panel.dataset.plaque) || ['',''];
    panel.querySelectorAll('.leadership-plaque-line>span').forEach((span,i) => {
     span.textContent = lines[i];
    });
   }
   fitAll();previousCSV = csv;
  } catch (error) {
   // A failed or partial download retains the last successful text and size.
   console.warn('Keeping existing leadership plaque text:',error.message);
  } finally {busy = false;}
 }
 if ('ResizeObserver' in window) {
  const observer = new ResizeObserver(scheduleFit);
  plaques.forEach(panel => observer.observe(panel));
 }
 window.addEventListener('resize',scheduleFit);
 if (document.fonts) {
  document.fonts.ready.then(scheduleFit);
  document.fonts.addEventListener('loadingdone',scheduleFit);
 }
 document.addEventListener('visibilitychange',() => {
  if (!document.hidden) {scheduleFit();refresh();}
 });
 window.LeadershipPlaques = {refresh,fit:scheduleFit};
 refresh();setInterval(refresh,CONFIG.refreshMilliseconds);
})();
</script>
